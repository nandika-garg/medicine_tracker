<!DOCTYPE html>
<html>
<head>
    <title>PillPal - Add Medicine</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0ef 0%, #f5f7fa 100%);
            margin: 0;
            padding: 30px;
            color: #2b2b2b;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1f5c57;
            font-size: 32px;
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .icon-options {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .icon-options label {
            font-size: 28px;
            background: #f5f7fa;
            border-radius: 12px;
            padding: 8px 12px;
            cursor: pointer;
            margin: 0;
        }
        .icon-options input {
            display: none;
        }
        .icon-options input:checked + span {
            outline: 3px solid #1f5c57;
            border-radius: 10px;
        }
        button {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        .back {
            text-align: center;
            margin-top: 15px;
        }
        .back a {
            color: #1f5c57;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ Add a Medicine</h1>

        <form method="POST">
            <label>Medicine Name</label>
            <input type="text" name="name" required>

            <label>Dosage (e.g. 500mg)</label>
            <input type="text" name="dosage">

            <label>Choose an Icon</label>
            <div class="icon-options">
                <label><input type="radio" name="icon" value="💊" checked><span>💊</span></label>
                <label><input type="radio" name="icon" value="🧴"><span>🧴</span></label>
                <label><input type="radio" name="icon" value="💉"><span>💉</span></label>
                <label><input type="radio" name="icon" value="🩹"><span>🩹</span></label>
                <label><input type="radio" name="icon" value="🍶"><span>🍶</span></label>
            </div>

            <label>Frequency (times per day)</label>
            <input
                type="number"
                name="frequency"
                id="frequency"
                min="1"
                max="6"
                required
                onchange="createDoseTimes()"
            >

            <div id="dose-times"></div>

            <label>Starting Stock</label>
            <input type="number" name="stock" required>

            <label>Low Stock Threshold</label>
            <input type="number" name="threshold" required>

            <button type="submit">Add Medicine</button>
        </form>

        <div class="back">
            <a href="/schedule">← Back to Schedule</a>
        </div>
    </div>

    <script>
        function createDoseTimes() {
            const frequency = parseInt(document.getElementById("frequency").value);
            const container = document.getElementById("dose-times");
            container.innerHTML = "";

            if (!frequency || frequency < 1) {
                return;
            }

            for (let i = 1; i <= frequency; i++) {
                const label = document.createElement("label");
                label.innerText = "Dose Time " + i;

                const input = document.createElement("input");
                input.type = "time";
                input.name = "dose_times";
                input.required = true;

                container.appendChild(label);
                container.appendChild(input);
            }
        }
    </script>
</body>
</html>
