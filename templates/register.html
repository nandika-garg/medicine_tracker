<!DOCTYPE html>
<html>
<head>
    <title>PillPal - Create Account</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0ef 0%, #f5f7fa 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        h1 {
            text-align: center;
            color: #1f5c57;
            font-size: 30px;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #5a5a5a;
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            color: #2b2b2b;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: #1f5c57;
            color: white;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        .flash {
            background: #fff6e0;
            color: #8a6d00;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        .link {
            text-align: center;
            margin-top: 15px;
        }
        .link a {
            color: #1f5c57;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>💊 PillPal</h1>
        <p class="subtitle">Create a caregiver account</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label>Patient's Name</label>
            <input type="text" name="patient_name" required>

            <label>Your Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Create Account</button>
        </form>

        <div class="link">
            Already have an account? <a href="/login">Log in</a>
        </div>
    </div>
</body>
</html>
